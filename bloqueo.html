<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Bloqueado - DARKCODE</title>
  <style>
    body { background: #000; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
    .box { border: 2px solid #dc2626; padding: 40px 20px; border-radius: 16px; background: #1a0000; box-shadow: 0 0 30px rgba(220, 38, 38, 0.5); max-width: 400px; }
    h1 { color: #dc2626; font-size: 2rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    p { color: #a1a1aa; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
    .codigo { color: #4ade80; font-weight: bold; background: #000; padding: 5px 10px; border-radius: 5px; display: inline-block; margin-bottom: 20px;}
    button { background: #dc2626; color: #fff; border: none; padding: 15px 30px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.1s; width: 100%; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="box">
    <h1>[!] Movimiento sospechoso</h1>
    <p>Has intentado inspeccionar el código o te has salido de repente.</p>
    <p class="codigo">El progreso de esta lección ha sido cancelado.</p>
    <p>Por favor, vuelve a la escuela y no hagas movimientos sospechosos.</p>
    <button onclick="window.location.href='./index.html'">Volver a DARKCODE</button>
  </div>
</body>
</html>
